# 多模态 · ① Early Fusion：concat([img, txt]) -> MLP
# 用法：python src/train_multimodal.py --config configs/fusion_early.yaml
modality: multimodal
fusion: early
data_root: data/cub200_subset
ann_file: data/cub200_subset/annotations.json
out_dir: outputs/fusion_early

proj_dim: 256                # 两个模态先各自投影到 256 维，再拼接成 512 维
image_backbone: resnet18
image_pretrained: true
freeze_image: false          # 微调 ResNet18
text_model: bert-base-uncased
freeze_text: true            # 冻结 BERT：只训练投影 + 融合 + 分类头
text_pooling: mean
max_length: 48
image_size: 224

epochs: 8
batch_size: 32
lr: 0.0003
weight_decay: 0.0001
dropout: 0.2
label_smoothing: 0.1
scheduler: cosine
amp: true
num_workers: 4
seed: 42
device: cuda
